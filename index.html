<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinetra Energy Vault | Vex Ecosystem</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Default Dark Theme Variables */
            --bg-gradient-start: #111827;
            --bg-gradient-end: #030712;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --gem-glow-1: #8b5cf6; /* Purple */
            --gem-glow-2: #0ea5e9; /* Cyan */
            --gem-glow-1-alpha: rgba(139, 92, 246, 0.6);
            --gem-glow-2-alpha: rgba(14, 165, 233, 0.6);
            --card-bg: linear-gradient(145deg, #1f2937, #111827);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-gradient-end);
            background-image: radial-gradient(circle at 50% 50%, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            transition: background 0.5s ease, color 0.5s ease;
        }

        h1, h2, h3, .brand-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Initial Page Load Animation */
        .fade-in-up {
            animation: fadeInUp 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 1. Mixed Credit Styles (Adapted for Themes) --- */
        .mixed-credit-container {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            transform-style: preserve-3d;
        }

        .orbital-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            box-sizing: border-box;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .ring-x {
            border-top: 2px solid var(--gem-glow-2);
            border-bottom: 2px solid transparent;
            animation: orbitX 4s linear infinite;
            box-shadow: inset 0 10px 20px -10px var(--gem-glow-2);
        }

        .ring-y {
            border-left: 2px solid var(--gem-glow-1);
            border-right: 2px solid transparent;
            animation: orbitY 5s linear infinite;
            box-shadow: inset 10px 0 20px -10px var(--gem-glow-1);
        }

        .ring-z {
            border-top: 2px solid var(--gem-glow-1);
            border-right: 2px solid transparent;
            animation: orbitZ 6s linear infinite;
        }

        @keyframes orbitX { 0% { transform: rotateX(60deg) rotateZ(0deg); } 100% { transform: rotateX(60deg) rotateZ(360deg); } }
        @keyframes orbitY { 0% { transform: rotateY(60deg) rotateZ(0deg); } 100% { transform: rotateY(60deg) rotateZ(360deg); } }
        @keyframes orbitZ { 0% { transform: rotateX(45deg) rotateY(45deg) rotateZ(0deg); } 100% { transform: rotateX(45deg) rotateY(45deg) rotateZ(360deg); } }

        .credit-gem {
            position: absolute;
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, var(--gem-glow-1-alpha) 0%, var(--gem-glow-2-alpha) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            transform: rotate(45deg);
            box-shadow: 0 0 40px var(--gem-glow-1-alpha), inset 0 0 20px rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: gemFloatAndPulse 4s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
            transform-style: preserve-3d;
            z-index: 10;
            transition: all 0.5s ease;
        }

        .credit-gem::after {
            content: '✦';
            transform: rotate(-45deg);
            font-size: 3.5rem;
            color: white;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 30px var(--gem-glow-2);
        }

        @keyframes gemFloatAndPulse {
            0% { transform: rotate(45deg) scale(0.95); box-shadow: 0 0 30px var(--gem-glow-1-alpha), inset 0 0 15px rgba(255, 255, 255, 0.3); }
            100% { transform: rotate(45deg) scale(1.05); box-shadow: 0 0 60px var(--gem-glow-2-alpha), inset 0 0 30px rgba(255, 255, 255, 0.6); }
        }

        /* --- 2. Button Styles (Adapted for Themes) --- */
        .btn-trace-container {
            position: relative;
            padding: 4px;
            border-radius: 12px;
            overflow: hidden;
            display: inline-flex;
            box-shadow: 0 0 30px var(--gem-glow-1-alpha);
            transition: box-shadow 0.3s ease, transform 0.2s;
            cursor: pointer;
        }

        .btn-trace-container:hover {
            box-shadow: 0 0 40px var(--gem-glow-2-alpha);
            transform: translateY(-2px);
        }

        .btn-trace-container::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, transparent, transparent, var(--gem-glow-2), var(--gem-glow-1), transparent);
            animation: rotateTrace 3s linear infinite;
        }

        .btn-trace {
            position: relative;
            background: var(--bg-gradient-start);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 18px 40px;
            border-radius: 10px;
            border: none;
            z-index: 1;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px var(--gem-glow-1-alpha);
            cursor: pointer;
            width: 100%;
        }

        .btn-trace:hover {
            box-shadow: inset 0 0 25px var(--gem-glow-1-alpha), inset 0 0 10px var(--gem-glow-2-alpha);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px var(--gem-glow-2);
        }
        
        .btn-trace:active { transform: scale(0.97); }
        @keyframes rotateTrace { 100% { transform: rotate(360deg); } }

        /* --- 3. Creator Card Styles (Original User Code) --- */
        .creator-card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8), inset 0 0 20px rgba(212, 175, 55, 0.05);
            position: relative;
            overflow: hidden;
            transition: background 0.5s ease;
        }
        .creator-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, transparent 60%);
            animation: spinRotateCard 15s linear infinite;
            pointer-events: none;
        }
        .crown-svg {
            width: 80px; height: 80px;
            fill: url(#gold-gradient);
            filter: drop-shadow(0 10px 15px rgba(212, 175, 55, 0.4));
            animation: floatSmooth 3s ease-in-out infinite, crownGlow 2s alternate infinite;
        }
        .gold-text {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shineGold 4s linear infinite;
        }
        @keyframes floatSmooth { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes spinRotateCard { 100% { transform: rotate(360deg); } }
        @keyframes crownGlow { 0% { filter: drop-shadow(0 5px 10px rgba(212, 175, 55, 0.3)); } 100% { filter: drop-shadow(0 15px 30px rgba(212, 175, 55, 0.7)); } }
        @keyframes shineGold { to { background-position: 200% center; } }

        /* --- Custom Utilities --- */
        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .theme-btn {
            width: 24px; height: 24px; border-radius: 50%;
            cursor: pointer; border: 2px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
        }
        .theme-btn:hover { transform: scale(1.2); }
        .theme-btn.active { border-color: white; box-shadow: 0 0 10px rgba(255,255,255,0.5); }

        /* Timer pulse */
        .pulse-text { animation: pulseOpacity 1.5s infinite; }
        @keyframes pulseOpacity { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="pb-10">

    <header class="w-full p-6 flex justify-center fade-in-up" style="animation-delay: 0.1s;">
        <div class="glass-panel px-6 py-3 rounded-full flex items-center gap-4 shadow-lg">
            <span class="text-xs font-semibold uppercase tracking-widest text-[var(--text-muted)] mr-2">Theme</span>
            <!-- Theme Colors (No Magenta as requested) -->
            <div class="theme-btn active" style="background: linear-gradient(135deg, #8b5cf6, #0ea5e9);" onclick="setTheme('dark', this)" title="Dark (Default)"></div>
            <div class="theme-btn" style="background: linear-gradient(135deg, #f3f4f6, #d1d5db);" onclick="setTheme('white', this)" title="White"></div>
            <div class="theme-btn" style="background: linear-gradient(135deg, #eab308, #ca8a04);" onclick="setTheme('neonYellow', this)" title="Neon Yellow"></div>
            <div class="theme-btn" style="background: linear-gradient(135deg, #ef4444, #b91c1c);" onclick="setTheme('neonRed', this)" title="Neon Red"></div>
            <div class="theme-btn" style="background: linear-gradient(135deg, #ec4899, #be185d);" onclick="setTheme('neonPink', this)" title="Neon Pink"></div>
            <div class="theme-btn" style="background: linear-gradient(135deg, #f97316, #c2410c);" onclick="setTheme('neonOrange', this)" title="Neon Orange"></div>
        </div>
    </header>

    <main class="w-full max-w-2xl flex flex-col items-center gap-12 mt-8 px-4 flex-grow">
        
        <!-- Header & Gem -->
        <div class="flex flex-col items-center justify-center gap-8 fade-in-up" style="animation-delay: 0.2s;">
            <div class="text-center z-20">
                <h1 class="text-4xl md:text-5xl font-bold brand-font mb-3" style="color: var(--gem-glow-1); text-shadow: 0 0 20px var(--gem-glow-1-alpha);">Trinetra Energy Vault</h1>
                <p class="text-sm tracking-[0.2em] uppercase font-semibold" style="color: var(--text-muted);">Generate 100 Credits Per Ad</p>
            </div>

            <!-- The Mixed Credit 3D Component from User -->
            <div class="mixed-credit-container">
                <div class="orbital-ring ring-x"></div>
                <div class="orbital-ring ring-y"></div>
                <div class="orbital-ring ring-z"></div>
                <div class="credit-gem"></div>
            </div>
        </div>

        <!-- Divider Line -->
        <div class="w-full h-px bg-gradient-to-r from-transparent via-[var(--gem-glow-1-alpha)] to-transparent fade-in-up" style="animation-delay: 0.3s;"></div>

        <!-- Action Section (Ad Button, Timer, Code Result) -->
        <div class="w-full flex flex-col items-center justify-center min-h-[160px] fade-in-up" style="animation-delay: 0.4s;" id="action-section">
            
            <!-- Step 1: Initial State (Watch Ad Button) -->
            <div id="step-1" class="flex flex-col items-center gap-4 w-full max-w-sm">
                <div class="btn-trace-container w-full" onclick="startAdFlow(this)">
                    <button class="btn-trace">⚡ Watch Ad for 100 Cr</button>
                </div>
                <p class="text-xs text-center mt-2" style="color: var(--text-muted);">
                    Clicking will open an ad in a new tab. Please wait on this page while energy is extracted.
                </p>
            </div>

            <!-- Step 2: Timer State (Hidden by default) -->
            <div id="step-2" class="hidden flex-col items-center gap-6 w-full">
                <div class="relative w-16 h-16">
                    <svg class="animate-spin w-full h-full" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" stroke="var(--gem-glow-1-alpha)" stroke-width="4"></circle>
                        <path d="M4 12A8 8 0 0112 4V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="var(--gem-glow-2)"></path>
                    </svg>
                    <div class="absolute inset-0 flex items-center justify-center font-bold text-lg" id="timer-display" style="color: var(--text-main);">15</div>
                </div>
                <p class="font-['Space_Grotesk'] tracking-widest text-sm uppercase pulse-text" style="color: var(--gem-glow-2);">Extracting Cursed Energy...</p>
            </div>

            <!-- Step 3: Result State (Generated Code - Hidden by default) -->
            <div id="step-3" class="hidden flex-col items-center w-full max-w-md gap-6">
                <p class="font-['Space_Grotesk'] tracking-widest text-sm uppercase text-green-400">Energy Extracted Successfully</p>
                
                <div class="w-full glass-panel p-6 rounded-2xl border flex flex-col items-center relative overflow-hidden">
                    <div class="absolute inset-0 opacity-20" style="background: repeating-linear-gradient(45deg, transparent, transparent 10px, var(--gem-glow-1-alpha) 10px, var(--gem-glow-1-alpha) 20px);"></div>
                    <p class="text-xs uppercase tracking-[0.2em] mb-2 relative z-10" style="color: var(--text-muted);">Your Daily Access Code</p>
                    <h2 id="generated-code" class="text-3xl md:text-4xl font-bold tracking-widest brand-font relative z-10 mb-4" style="color: var(--text-main); text-shadow: 0 0 15px var(--gem-glow-2);">VEX-XXXX-XXXX</h2>
                    
                    <div class="flex gap-4 relative z-10 w-full mt-2">
                        <button onclick="copyCode()" id="copy-btn" class="flex-1 py-3 rounded-lg font-bold uppercase tracking-wider text-sm transition-all" style="background: rgba(255,255,255,0.1); border: 1px solid var(--gem-glow-1); color: var(--text-main);">
                            📋 Copy Code
                        </button>
                    </div>
                </div>

                <div class="btn-trace-container w-full max-w-sm" onclick="returnToMainApp()">
                    <button class="btn-trace text-sm py-4">Return to Trinetra AI</button>
                </div>
            </div>

        </div>

        <!-- Divider Line -->
        <div class="w-full h-px bg-gradient-to-r from-transparent via-[var(--gem-glow-1-alpha)] to-transparent fade-in-up" style="animation-delay: 0.5s;"></div>

        <!-- Component 3: Creator Card (Strictly without YouTube Mention) -->
        <div class="creator-card p-10 md:p-14 rounded-[2rem] flex flex-col items-center gap-6 transform transition-transform hover:scale-[1.03] duration-500 w-full max-w-md fade-in-up" style="animation-delay: 0.6s;">
            <svg class="crown-svg relative z-10" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#bf953f" />
                        <stop offset="25%" stop-color="#fcf6ba" />
                        <stop offset="50%" stop-color="#b38728" />
                        <stop offset="75%" stop-color="#fbf5b7" />
                        <stop offset="100%" stop-color="#aa771c" />
                    </linearGradient>
                </defs>
                <path d="M10,80 L90,80 L85,90 L15,90 Z M15,75 L20,30 L35,55 L50,15 L65,55 L80,30 L85,75 Z" stroke="#8b6508" stroke-width="1" stroke-linejoin="round"/>
                <circle cx="20" cy="25" r="4" fill="white" opacity="0.8"/>
                <circle cx="50" cy="10" r="5" fill="white" opacity="0.9"/>
                <circle cx="80" cy="25" r="4" fill="white" opacity="0.8"/>
            </svg>
            <div class="text-center relative z-10">
                <p class="text-[var(--text-muted)] text-xs tracking-[0.3em] uppercase mb-2 font-semibold font-['Inter']">Designed & Engineered By</p>
                <h2 class="text-3xl md:text-4xl font-bold gold-text brand-font">Abhinav</h2>
            </div>
        </div>

    </main>

    <script>
        // Links Configuration
        const ADSTERRA_LINK = "Https://araplhn.org/4/f79aeb62a3884886be6c87db37d17602";
        const MAIN_AI_LINK = "https:abhi-ye-place_holderlinkhai";
        
        // Custom Inline Alert (No ugly browser alerts allowed)
        function showMessage(msg, btnId) {
            const btn = document.getElementById(btnId);
            const originalText = btn.innerHTML;
            btn.innerHTML = `✔️ ${msg}`;
            btn.style.background = 'rgba(16, 185, 129, 0.2)'; // Tailwind Emerald
            btn.style.borderColor = '#10b981';
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = 'rgba(255,255,255,0.1)';
                btn.style.borderColor = 'var(--gem-glow-1)';
            }, 3000);
        }

        // --- THEME ENGINE ---
        const themes = {
            dark: { bg1: '#111827', bg2: '#030712', text: '#ffffff', textMuted: '#9ca3af', g1: '#8b5cf6', g2: '#0ea5e9', card: 'linear-gradient(145deg, #1f2937, #111827)' },
            white: { bg1: '#f9fafb', bg2: '#e5e7eb', text: '#111827', textMuted: '#4b5563', g1: '#4f46e5', g2: '#06b6d4', card: 'linear-gradient(145deg, #ffffff, #f3f4f6)' },
            neonYellow: { bg1: '#1a1c05', bg2: '#050505', text: '#ffffff', textMuted: '#a1a1aa', g1: '#eab308', g2: '#ca8a04', card: 'linear-gradient(145deg, #27272a, #09090b)' },
            neonRed: { bg1: '#1c0505', bg2: '#050000', text: '#ffffff', textMuted: '#a1a1aa', g1: '#ef4444', g2: '#b91c1c', card: 'linear-gradient(145deg, #27272a, #09090b)' },
            neonPink: { bg1: '#1c0513', bg2: '#050003', text: '#ffffff', textMuted: '#a1a1aa', g1: '#ec4899', g2: '#be185d', card: 'linear-gradient(145deg, #27272a, #09090b)' },
            neonOrange: { bg1: '#1c0a05', bg2: '#050200', text: '#ffffff', textMuted: '#a1a1aa', g1: '#f97316', g2: '#c2410c', card: 'linear-gradient(145deg, #27272a, #09090b)' }
        };

        function hexToRgba(hex, alpha) {
            let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function setTheme(themeName, btnElement) {
            // Update active button state
            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            const t = themes[themeName];
            const root = document.documentElement;
            
            root.style.setProperty('--bg-gradient-start', t.bg1);
            root.style.setProperty('--bg-gradient-end', t.bg2);
            root.style.setProperty('--text-main', t.text);
            root.style.setProperty('--text-muted', t.textMuted);
            root.style.setProperty('--gem-glow-1', t.g1);
            root.style.setProperty('--gem-glow-2', t.g2);
            root.style.setProperty('--gem-glow-1-alpha', hexToRgba(t.g1, 0.6));
            root.style.setProperty('--gem-glow-2-alpha', hexToRgba(t.g2, 0.6));
            root.style.setProperty('--card-bg', t.card);
        }

        // --- MATH & CRYPTO ENGINE FOR REDEEM CODE ---
        // Generates a hash based on the current date, so all users get a mathematically verifiable code for the day.
        function generateSecureCode() {
            // Get today's date in YYYY-MM-DD
            const today = new Date();
            // Use UTC to ensure users in different timezones near midnight don't get mismatching codes
            const dateStr = `${today.getUTCFullYear()}-${today.getUTCMonth()+1}-${today.getUTCDate()}`; 
            const salt = "TRINETRA_MASTER_SALT_2026"; 
            
            const stringToHash = dateStr + salt;
            let hash = 0;
            for (let i = 0; i < stringToHash.length; i++) {
                let char = stringToHash.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash; // Convert to 32bit integer
            }
            
            // Format: VEX - [3 Random Letters for uniqueness] - [5 Char Date Hash for validation]
            const hashStr = Math.abs(hash).toString(16).toUpperCase().substring(0, 5).padStart(5, '0');
            
            // We add 3 random characters so if a user clicks 5 times, they get 5 "different" looking codes,
            // but the main AI will only check if it ends with the valid `hashStr` and hasn't been used before.
            const randomPart = Math.random().toString(36).substring(2, 5).toUpperCase();
            
            return `VEX-${randomPart}-${hashStr}`;
        }

        // --- AD FLOW & TIMER LOGIC ---
        function startAdFlow(btnContainer) {
            // Button visual feedback
            btnContainer.style.transform = 'scale(0.9)';
            setTimeout(() => btnContainer.style.transform = 'scale(1)', 150);

            // 1. Open Adsterra link in new tab
            window.open(ADSTERRA_LINK, '_blank');

            // 2. Hide Step 1, Show Step 2 (Timer)
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
            document.getElementById('step-2').classList.add('flex');

            // 3. Start 15-second Timer
            let timeLeft = 15;
            const timerDisplay = document.getElementById('timer-display');
            
            const timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    finishAdFlow();
                }
            }, 1000);
        }

        function finishAdFlow() {
            // Generate Code
            const finalCode = generateSecureCode();
            document.getElementById('generated-code').innerText = finalCode;

            // Hide Step 2, Show Step 3 (Result)
            document.getElementById('step-2').classList.remove('flex');
            document.getElementById('step-2').classList.add('hidden');
            
            document.getElementById('step-3').classList.remove('hidden');
            document.getElementById('step-3').classList.add('flex');
            
            // Add a small pop animation
            document.getElementById('step-3').animate([
                { transform: 'scale(0.9)', opacity: 0 },
                { transform: 'scale(1)', opacity: 1 }
            ], { duration: 400, easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.275)' });
        }

        // --- UTILITIES ---
        function copyCode() {
            const codeText = document.getElementById('generated-code').innerText;
            try {
                // Using modern clipboard API with fallback wrapper
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(codeText).then(() => {
                        showMessage("Copied", 'copy-btn');
                    });
                } else {
                    // Fallback for older browsers or non-secure contexts like iframes
                    let textArea = document.createElement("textarea");
                    textArea.value = codeText;
                    textArea.style.position = "fixed";
                    textArea.style.left = "-999999px";
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    document.execCommand('copy');
                    textArea.remove();
                    showMessage("Copied", 'copy-btn');
                }
            } catch (err) {
                console.error("Failed to copy", err);
            }
        }

        function returnToMainApp() {
